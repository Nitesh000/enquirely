services:
  postgres:
    image: postgres:17-alpine
    container_name: inquirely-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: inquirely
      POSTGRES_PASSWORD: inquirely
      POSTGRES_DB: inquirely
    volumes:
      - inquirely-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inquirely -d inquirely"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: inquirely-pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@inquirely.com
      PGADMIN_DEFAULT_PASSWORD: inquirely
    ports:
      - "5050:80"

volumes:
  inquirely-pgdata:
